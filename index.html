}

write("> " + v);

write("CONNECTING TO DEVKIT CORE...");
setTimeout(()=>write("DOWNLOADING MODULE..."),500);
setTimeout(()=>write("EXECUTING LEVEL 2..."),1000);

setTimeout(()=>{
level2 = true;
write("");
write("=== ANDREW_DEVKIT LEVEL 2 ===");
write("SYSTEM TERMINAL ONLINE");
write("TYPE: help / logs / exploit");
},1500);

return;
}

// ❌ если Level 2 не активирован
if(!level2){
write("UNKNOWN COMMAND");
return;
}

// 🟢 LEVEL 2 команды
if(v==="help"){
write("commands: logs / scan / exploit");
}

else if(v==="logs"){
write(
"log_01 system boot\n"+
"log_02 user detected\n"+
"log_03 auth ok\n"+
"log_04 memory sync\n"+

"log_06 trace running\n"+
"log_07 corruption rising\n"+
"log_08 hidden path found\n"+
"log_09 core fragment unstable\n"+
"log_10 CORE MEMORY LINK"
);
}

else if(v==="exploit"){
write("SYSTEM BREACH DETECTED...");
write("searching vulnerabilities...");
write("hidden endpoint: /memory/core/message.txt");
write("ACCESS KEY: apopimchiki-core");
write("CORE UNLOCKED");
}

else if(v==="scan"){
write("scanning system...");

}

else{

}
}

</script>
